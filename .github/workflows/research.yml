name: Research Test

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run research
        run: python src/research.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
